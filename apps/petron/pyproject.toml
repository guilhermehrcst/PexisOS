[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "petron"
version = "0.1.0"
description = "PETRON V0.1: supervised engineering runtime (experimental)"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
# Real provider (optional, opt-in per run; never needed offline).
anthropic = ["anthropic>=2.1,<3"]
# Read-only PexisOS Agent Fabric connector; same pin as PexisOS requirements/fabric-mcp.txt.
pexisos = ["mcp==2.2.0"]

[project.scripts]
petron = "petron.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
