name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q src tests scripts
      - name: Run unit, property, metamorphic and integration tests (standard library only)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the legacy v0.1 invocation and the v0.2 pipeline
        env:
          PYTHONPATH: src
        run: |
          python -m pexislink --baseline examples/baseline.csv --observations examples/observations.csv
          python -m pexislink synth --scenario abrupt_anomaly --seed 1 --out "$RUNNER_TEMP/demo" --reference-days 4 --eval-days 13
          python -m pexislink detect --reference "$RUNNER_TEMP/demo/reference.csv" \
            --observations "$RUNNER_TEMP/demo/observations.csv" \
            --summary "$RUNNER_TEMP/demo/summary.json" > "$RUNNER_TEMP/demo/assessments.jsonl"
          python -c "import json, sys; print(json.load(open(sys.argv[1]))['observations']['status_counts'])" \
            "$RUNNER_TEMP/demo/summary.json"
      - name: Smoke-test the Agent Fabric without the optional MCP SDK
        env:
          PYTHONPATH: src
        run: |
          python examples/fabric/python_api.py
          python -m pexislink fabric demo > /dev/null
          set +e; python -m pexislink fabric mcp-stdio --principal demo:principal:guest; code=$?; set -e
          test "$code" -eq 3  # mcp_unavailable: the core never requires the SDK

  fabric-mcp:
    name: fabric-mcp (real MCP SDK, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned, hash-locked optional MCP SDK
        run: python -m pip install --require-hashes -r requirements/fabric-mcp.txt
      - name: Run the whole suite with the real SDK installed (MCP tests must run, not skip)
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/tests.log"
          if grep -q "not_run: mcp is not installed" "$RUNNER_TEMP/tests.log"; then
            echo "::error::MCP integration tests were skipped although the SDK is installed."
            exit 1
          fi
      - name: Smoke-test the developer demo
        env:
          PYTHONPATH: src
        run: |
          python -m pexislink fabric demo > "$RUNNER_TEMP/demo.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['audit']['chain_valid']" "$RUNNER_TEMP/demo.json"
          python examples/fabric/mcp_client.py demo:principal:guest

  compat-openai-agents:
    name: compat-openai-agents (OpenAI Agents SDK over MCP stdio, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned, hash-locked test-only SDK (no API key, no model calls)
        run: python -m pip install --require-hashes -r requirements/compat-openai-agents.txt
      - name: Run the 15-case interoperability matrix (every case must PASS; NOT_RUN fails the job)
        env:
          PYTHONPATH: src
          OPENAI_AGENTS_DISABLE_TRACING: "1"
        run: python tests/compat/run_matrix.py --require-all-pass --json "$RUNNER_TEMP/compat-report.json"

  benchmark-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate the quick benchmark and require identical results
        env:
          PYTHONPATH: src
        run: |
          python -m pexislink benchmark --profile quick --out "$RUNNER_TEMP/quick" --quiet
          if ! cmp -s reports/benchmark-quick/results.json "$RUNNER_TEMP/quick/results.json"; then
            echo "::error::Benchmark results differ from reports/benchmark-quick/results.json."
            echo "Regenerate with: PYTHONPATH=src python -m pexislink benchmark --profile quick --out reports/benchmark-quick"
            diff -u reports/benchmark-quick/results.json "$RUNNER_TEMP/quick/results.json" | head -120
            exit 1
          fi
          cat "$RUNNER_TEMP/quick/provenance.json"

  can-replay-cantools:
    # v0.4 Lab A: the real optional decoder, hash-locked. Network is used only by pip to fetch the
    # pinned packages; the tests themselves are offline and the replay refuses sockets and processes.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned optional decoder (hash-checked)
        run: python -m pip install --require-hashes -r requirements/lab-can.txt
      - name: Run the whole suite with the real decoder present
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

