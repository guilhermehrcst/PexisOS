name: PETRON

# PETRON (apps/petron) is an independent component of the PexisOS monorepo. These jobs never
# install it into the PexisOS core environment and the core workflow (tests.yml) never imports it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: petron-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  petron-core:
    name: petron (standard library only, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q apps/petron/src apps/petron/tests
      - name: Unit, adversarial and boundary tests (no optional dependency, no sandbox image)
        working-directory: apps/petron
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -t tests -v

  petron-isolation:
    name: petron (Docker sandbox + Agent Fabric MCP, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned, hash-locked MCP SDK (same lock as the Agent Fabric)
        run: python -m pip install --require-hashes -r requirements/fabric-mcp.txt
      - name: Pull the digest-pinned sandbox image (runs use --pull never)
        run: docker pull mirror.gcr.io/library/python@sha256:cce12316475d7d56d605f76e1d811d0dc4e7227f2d4afd29951521264f504ff8
      - name: Measure isolation (fails the job if any probe check fails)
        env:
          PYTHONPATH: apps/petron/src
        run: python -m petron sandbox probe
      - name: Whole suite; Docker and Fabric tests must run, not skip
        shell: bash # enforce -o pipefail: unittest failure must never be hidden by tee
        working-directory: apps/petron
        env:
          PYTHONPATH: src:tests
          PETRON_PEXISLINK_SRC: ${{ github.workspace }}/src
        run: |
          python -m unittest discover -s tests -t tests -v 2>&1 | tee "$RUNNER_TEMP/petron-tests.log"
          if grep -q "skipped" "$RUNNER_TEMP/petron-tests.log"; then
            echo "::error::PETRON tests were skipped although Docker and the MCP SDK are available."
            exit 1
          fi
      - name: Reproduce PETRON-E001 through the CLI (deterministic provider; infrastructure, not autonomy)
        env:
          PYTHONPATH: apps/petron/src
          PETRON_HOME: ${{ runner.temp }}/petron-home
        run: |
          python -m petron experiment e001 --approver "ci-harness (GitHub Actions; synthetic fixture; not a human review)"
          python -m petron events verify
      - name: Reproduce PETRON-E002-A through the CLI (deterministic agent policy; loop mechanics, not cognition)
        env:
          PYTHONPATH: apps/petron/src
          PETRON_HOME: ${{ runner.temp }}/petron-home-e002
        run: |
          python -m petron experiment e002 --approver "ci-harness (GitHub Actions; synthetic fixture; not a human review)"
          python -m petron mission log petron-e002
          python -m petron events verify
