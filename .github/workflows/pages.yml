name: PexisOS Pages (Brain home + Console)

# Public site: the visual-only PETRON Brain at / and the offline/synthetic Smart Fan Console at /console/.
# Never the PETRON bridge, runtime, commands, mission approval, event stream or any API: the Brain is a
# fixed allowlist of four static files, assembled and verified by scripts/build_pages_site.py.
# A PR builds and tests but cannot deploy; only main/explicit dispatch may deploy.
on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "apps/console/**"
      - "apps/petron/brain/**"
      - "scripts/build_pages_site.py"
      - "tests/test_pages_site.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "apps/console/**"
      - "apps/petron/brain/**"
      - "scripts/build_pages_site.py"
      - "tests/test_pages_site.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pexisos-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build the static site (Brain home + Console)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/console
    steps:
      - name: Check out source (no retained token)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - name: Install integrity-locked dependencies (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict TypeScript checks
        run: npm run typecheck
      - name: Synthetic UI and domain tests
        run: npm test
      - name: Build static assets (relative paths for /PexisOS/)
        run: npm run build
      - name: Deny browser network APIs and external resources
        run: npm run check:offline
      - name: Verify the Console build has a static entrypoint
        run: |
          test -s dist/index.html
          test -d dist/assets
          if grep -E '((src|href)="/assets/|src="/src/)' dist/index.html; then
            echo "::error::Absolute asset path is incompatible with project Pages"
            exit 1
          fi
      - name: Test the site builder and its publication rules
        working-directory: .
        run: python3 -m unittest tests.test_pages_site -v
      - name: Assemble the site (Brain at /, Console at /console/)
        working-directory: .
        run: python3 scripts/build_pages_site.py --console-dist apps/console/dist --out site
      - name: Verify the assembled site (exact file set, no operational capability, resolvable paths)
        working-directory: .
        run: python3 scripts/build_pages_site.py --verify-only --out site
      - name: Upload Pages artifact (not on pull requests)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy the static site to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
