[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pexislink"
dynamic = ["version"]
description = "Read-only vehicle telemetry and anomaly detection research"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["telemetry", "anomaly-detection", "vehicle-health"]
dependencies = []

[project.scripts]
pexislink = "pexislink.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pexislink.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
