[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pexislink"
dynamic = ["version"]
description = "Read-only vehicle telemetry and anomaly detection research"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["telemetry", "anomaly-detection", "vehicle-health"]
dependencies = []

[project.optional-dependencies]
# Optional MCP transport for the experimental Agent Fabric. For a reproducible,
# hash-checked install use requirements/fabric-mcp.txt instead.
mcp = ["mcp==2.2.0"]
# v0.4 Lab A offline CAN replay only. For a reproducible, hash-checked install of the whole tested
# tree (cantools pulls python-can, LGPL-3.0), use requirements/lab-can.txt; see docs/CAN-REPLAY-LAB-A.md.
can = ["cantools==44.1.0"]

[project.scripts]
pexislink = "pexislink.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pexislink.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
